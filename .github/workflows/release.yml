name: Release

on:
  push:
    tags:
      - 'v*'

# Trusted publishing (OIDC): npm trusts this workflow, no token nor secret is involved.
# The trust relationship on npmjs.com only allows `npm stage publish`: the version lands on npm as
# "staged", and a maintainer publishes it from npmjs.com with their 2FA.
permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Build & stage on npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Node.js 24 ships npm 11.19: trusted publishing and `npm stage` need npm >= 11.5.1
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # `npm stage publish` runs prepublishOnly (lint + test; the test run builds dist/) exactly once, packs and stages the package
      - name: Stage on npm
        run: npm stage publish --access public
